name: Windows build

on:
  push:
    branches: [main, windows-port]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --windowed --name "AI File Cleaner" --paths src src/windows_entry.py
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path "dist/AI File Cleaner/*" -DestinationPath "AI-File-Cleaner-Windows.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-File-Cleaner-Windows
          path: AI-File-Cleaner-Windows.zip
